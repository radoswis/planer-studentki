<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<title>Planer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f7f5f0;color:#2c2c2a}
main{max-width:520px;margin:0 auto;padding:12px 14px 90px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e4e1d8;z-index:5}
.tabs button{flex:1;padding:14px;border:0;background:none;font-size:15px;color:#888}
.tabs button.on{color:#2c2c2a;font-weight:600}
h1{font-size:20px;font-weight:600;margin:6px 0 12px}
label{display:block;font-size:13px;color:#777;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #ddd9cf;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:70px;resize:vertical}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#2c2c2a;color:#fff;font-size:15px;margin-top:12px}
.btn2{padding:8px 12px;border:1px solid #ddd9cf;border-radius:10px;background:#fff;font-size:14px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors span{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.colors span.sel{border-color:#2c2c2a}
.card{border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card small{opacity:.8}
.x{border:0;background:none;font-size:18px;opacity:.6}
.day{display:flex;gap:10px;padding:10px 0;border-top:1px solid #e4e1d8}
.day.today .dl{font-weight:700;color:#2c2c2a}
.dl{width:46px;font-size:13px;color:#888;line-height:1.3;flex-shrink:0}
.blk{border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:5px;cursor:pointer}
.blk.done{opacity:.45;text-decoration:line-through}
.dead{font-size:13px;color:#993556;padding:4px 0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-bottom:6px}
.empty{color:#999;font-size:14px;padding:6px 0}
.hint{font-size:12px;color:#999;margin-top:8px}
</style>
</head>
<body>
<main>
<section id="cal">
  <div class="nav"><button class="btn2" onclick="shiftWeek(-1)">‹</button><h1 id="wk" style="margin:0"></h1><button class="btn2" onclick="shiftWeek(1)">›</button></div>
  <div class="legend" id="legend"></div>
  <div id="days"></div>
  <button class="btn" onclick="replanAll()">↻ Przeplanuj wszystko</button>
  <div class="hint">Stuknij krok, aby oznaczyć jako zrobiony.</div>
</section>
<section id="list" hidden>
  <h1>Nowe zadanie</h1>
  <label>Przedmiot</label><input id="fSub" placeholder="Psychologia poznawcza" list="subs"><datalist id="subs"></datalist>
  <label>Co dokładnie jest do zrobienia</label><textarea id="fDesc" placeholder="2 fragmenty książki, prezentacja, egzamin"></textarea>
  <label>Deadline</label><input id="fDl" type="date">
  <label>Kolor przedmiotu</label><div class="colors" id="fCol"></div>
  <button class="btn" onclick="addTask()">+ Dodaj i rozplanuj</button>
  <h1 style="margin-top:22px">Zadania</h1>
  <div id="tasks"></div>
</section>
</main>
<nav class="tabs"><button id="tCal" class="on" onclick="tab('cal')">📅 Kalendarz</button><button id="tList" onclick="tab('list')">📝 Lista zadań</button></nav>
<script>
// Adres Workera z AI (opcjonalnie). Pusty = lokalny algorytm.
const AI_URL = '/api/plan';
const COLORS=[['#d9ede3','#0f5a44'],['#dce9f7','#0c447c'],['#f6dde6','#72243e'],['#f8e8cc','#633806'],['#e6e3f8','#3c3489'],['#f3e0d8','#712b13']];
const DAYS=['Nd','Pon','Wt','Śr','Czw','Pt','Sob'];
let S, week=0, selCol=0;

function load(){try{const d=JSON.parse(localStorage.getItem('planer'));if(d)return d}catch(e){}return demo()}
function save(){try{localStorage.setItem('planer',JSON.stringify(S))}catch(e){}}
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
function monday(off){const d=new Date();d.setHours(12);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+off*7);return iso(d)}

// Rozbija opis na kroki
function steps(desc){
  const parts=desc.split(/,|;|\+|\n| i | oraz /i).map(s=>s.trim()).filter(Boolean);
  const out=[];
  for(const p of parts){
    const n=parseInt((p.match(/\d+/)||[1])[0]);
    const l=p.toLowerCase();
    if(/fragment|rozdzia|artyku|tekst|lektur|czyta/.test(l)){
      const what=/rozdzia/.test(l)?'rozdziału':/artyku/.test(l)?'artykułu':'fragmentu';
      for(let i=1;i<=Math.min(n,10);i++)out.push({text:`Czytanie ${what} ${n>1?i:''}`.trim(),w:1});
    }else if(/prezentac|slajd/.test(l)){
      out.push({text:'Prezentacja: konspekt i materiały',w:1},{text:'Prezentacja: slajdy',w:1});
    }else if(/egzamin|kolokwium|test|zalicz/.test(l)){
      out.push({text:'Nauka do egzaminu',w:1,last:1},{text:'Powtórka przed egzaminem',w:1,last:1});
    }else if(/projekt|esej|prac/.test(l)){
      out.push({text:p+' – plan',w:1},{text:p+' – pisanie',w:1},{text:p+' – poprawki',w:1});
    }else out.push({text:p.charAt(0).toUpperCase()+p.slice(1),w:1});
  }
  return out.sort((a,b)=>(a.last||0)-(b.last||0));
}

// Obciążenie dni przez inne zadania
function loads(skipId){const m={};S.tasks.forEach(t=>{if(t.id===skipId)return;t.steps.forEach(s=>{if(!s.done)m[s.date]=(m[s.date]||0)+1})});return m}

// Rozkłada kroki od dziś do dnia przed deadline'em, wybierając najmniej obciążone dni
function schedule(list,deadline,skipId){
  const start=today(),end=addD(deadline,-1);
  const D=Math.max(1,diff(start,end)+1),L=loads(skipId);
  let prev=0;
  return list.map((s,i)=>{
    const rem=list.length-i-1;
    const lo=s.last?Math.max(prev,D-1-rem):prev,hi=Math.max(lo,D-1-Math.floor(rem*D/list.length/1.5));
    let best=lo;
    for(let k=lo;k<=Math.min(hi,D-1);k++){if((L[addD(start,k)]||0)<(L[addD(start,best)]||0))best=k}
    const date=addD(start,diff(start,end)<0?0:best);
    L[date]=(L[date]||0)+1;prev=best;
    return{text:s.text,date,done:false};
  });
}

async function plan(t){
  if(AI_URL){try{
    const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:t.subject,desc:t.desc,deadline:t.deadline,today:today(),busy:loads(t.id)})});
    const j=await r.json();
    if(Array.isArray(j.steps)&&j.steps.length)return j.steps.map(s=>({text:s.text,date:s.date,done:false}));
  }catch(e){}}
  return schedule(steps(t.desc),t.deadline,t.id);
}

async function addTask(){
  const sub=fSub.value.trim(),desc=fDesc.value.trim(),dl=fDl.value;
  if(!sub||!desc||!dl)return alertMsg('Uzupełnij przedmiot, opis i deadline.');
  if(dl<=today())return alertMsg('Deadline musi być w przyszłości.');
  S.colors[sub]=S.colors[sub]??selCol;
  const t={id:Date.now(),subject:sub,desc,deadline:dl};
  const b=document.querySelector('#list .btn');b.textContent='Planuję z AI…';b.disabled=true;
  t.steps=await plan(t);
  b.textContent='+ Dodaj i rozplanuj';b.disabled=false;
  S.tasks.push(t);save();fDesc.value='';render();tab('cal');
}
function alertMsg(m){let e=document.getElementById('err');if(!e){e=document.createElement('div');e.id='err';e.style.cssText='color:#a32d2d;font-size:13px;margin-top:8px';document.querySelector('#list .btn').after(e)}e.textContent=m;setTimeout(()=>e.textContent='',3000)}

async function replanAll(){
  const t0=today();
  for(const t of S.tasks){
    if(t.deadline<=t0)continue;
    const done=t.steps.filter(s=>s.done),todo=t.steps.filter(s=>!s.done);
    t.steps=[];
    t.steps=done.concat(schedule(todo,t.deadline,t.id));
  }
  save();render();
}
function toggle(id,i){const t=S.tasks.find(t=>t.id===id);t.steps[i].done=!t.steps[i].done;save();render()}
function del(id){if(!confirm('Usunąć zadanie?'))return;S.tasks=S.tasks.filter(t=>t.id!==id);save();render()}
const col=s=>COLORS[S.colors[s]??0];

function render(){
  const m=monday(week),t0=today();
  wk.textContent=`${+m.slice(8)}.${m.slice(5,7)} – ${+addD(m,6).slice(8)}.${addD(m,6).slice(5,7)}`;
  legend.innerHTML=[...new Set(S.tasks.map(t=>t.subject))].map(s=>`<span style="color:${col(s)[1]}">● ${s}</span>`).join('');
  let h='';
  for(let i=0;i<7;i++){
    const d=addD(m,i),dt=new Date(d+'T12:00');
    let c='';
    S.tasks.forEach(t=>{
      t.steps.forEach((s,k)=>{if(s.date===d){const[bg,fg]=col(t.subject);c+=`<div class="blk${s.done?' done':''}" style="background:${bg};color:${fg}" onclick="toggle(${t.id},${k})">${s.done?'✓ ':''}${s.text} <small>· ${t.subject}</small></div>`}});
      if(t.deadline===d)c+=`<div class="dead">⚑ Deadline: ${t.subject}</div>`;
    });
    h+=`<div class="day${d===t0?' today':''}"><div class="dl">${DAYS[dt.getDay()]}<br>${dt.getDate()}</div><div style="flex:1">${c||'<div class="empty">wolne</div>'}</div></div>`;
  }
  days.innerHTML=h;
  tasks.innerHTML=S.tasks.length?S.tasks.slice().sort((a,b)=>a.deadline<b.deadline?-1:1).map(t=>{const[bg,fg]=col(t.subject),d=t.steps.filter(s=>s.done).length;return`<div class="card" style="background:${bg};color:${fg}"><div><b>${t.subject}</b><br><small>${t.desc}</small><br><small>${d}/${t.steps.length} kroków · do ${t.deadline.slice(8)}.${t.deadline.slice(5,7)}</small></div><button class="x" style="color:${fg}" onclick="del(${t.id})">✕</button></div>`}).join(''):'<div class="empty">Dodaj pierwsze zadanie powyżej.</div>';
  subs.innerHTML=Object.keys(S.colors).map(s=>`<option value="${s}">`).join('');
  fCol.innerHTML=COLORS.map((c,i)=>`<span style="background:${c[0]}" class="${i===selCol?'sel':''}" onclick="selCol=${i};render()"></span>`).join('');
}
function shiftWeek(n){week+=n;render()}
function tab(x){cal.hidden=x!=='cal';list.hidden=x!=='list';tCal.classList.toggle('on',x==='cal');tList.classList.toggle('on',x==='list')}
fSub.addEventListener('change',()=>{if(S.colors[fSub.value]!=null){selCol=S.colors[fSub.value];render()}});

function demo(){
  S={tasks:[],colors:{'Psychologia poznawcza':0,'Psychometria':1}};
  let sat=addD(monday(0),5);if(sat<=today())sat=addD(sat,7);
  [['Psychologia poznawcza','2 fragmenty książki, prezentacja'],['Psychometria','egzamin z teorii']].forEach(([s,d],i)=>{
    const t={id:i+1,subject:s,desc:d,deadline:sat};t.steps=schedule(steps(d),sat,t.id);S.tasks.push(t)});
  return S;
}
S=load();
fDl.min=addD(today(),1);
render();
</script>
</body>
</html>
