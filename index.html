<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<title>Planer</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f7f5f0;color:#2c2c2a}
main{max-width:520px;margin:0 auto;padding:12px 14px 90px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e4e1d8;z-index:5}
.tabs button{flex:1;padding:14px 4px;border:0;background:none;font-size:15px;color:#888}
.tabs button.on{color:#2c2c2a;font-weight:600}
h1{font-size:20px;font-weight:600;margin:6px 0 12px}
label{display:block;font-size:13px;color:#777;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #ddd9cf;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:70px;resize:vertical}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#2c2c2a;color:#fff;font-size:15px;margin-top:12px}
.btn2{padding:8px 12px;border:1px solid #ddd9cf;border-radius:10px;background:#fff;font-size:14px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors span{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.colors span.sel{border-color:#2c2c2a}
.card{border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card small{opacity:.8}
.x{border:0;background:none;font-size:18px;opacity:.7;min-width:44px;min-height:44px}
.day{display:flex;gap:10px;padding:10px 0;border-top:1px solid #e4e1d8}
.day.today .dl{font-weight:700;color:#2c2c2a}
.dl{width:46px;font-size:13px;color:#888;line-height:1.3;flex-shrink:0}
.blk{border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:5px;cursor:pointer}
.blk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ghost{position:fixed;z-index:20;pointer-events:none;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.35);transform:scale(1.04)}
#days{touch-action:pan-y}
@keyframes inL{from{transform:translateX(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(-60%);opacity:0}to{transform:none;opacity:1}}
.inL{animation:inL .25s ease-out}.inR{animation:inR .25s ease-out}
.day.over{background:rgba(127,127,127,.15);border-radius:8px}
.edge{position:fixed;top:0;bottom:0;width:28px;z-index:19;background:rgba(127,127,127,.25);display:none}
.blk.done{opacity:.45;text-decoration:line-through}
.dead{font-size:13px;color:#993556;padding:4px 0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-bottom:6px}
.empty{color:#777;font-size:14px;padding:6px 0}
.srow{display:flex;gap:6px;margin:5px 0}.srow input[type=text]{flex:1}.srow input[type=date]{width:130px}
.combo{position:relative}.combo input{padding-right:42px}.cbtn{position:absolute;right:4px;top:4px;bottom:4px;width:36px;border:0;background:none;font-size:16px;color:#777}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #ddd9cf;border-radius:10px;max-height:240px;overflow-y:auto;z-index:10;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.dd div{padding:11px 12px;display:flex;align-items:center;gap:10px;border-top:1px solid #f0ede5}.dd div:first-child{border-top:0}.dd i{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.subj{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #e4e1d8}.subj i{width:26px;height:26px;border-radius:50%;cursor:pointer;flex-shrink:0}.subj span{flex:1}
.hint{font-size:12px;color:#6f6f6a;margin-top:8px}
.sync{font-size:12px;color:#6f6f6a;text-align:center;margin:-2px 0 6px}.sync.err{color:#a32d2d}
.late{background:#fbe9e9;border-radius:10px;padding:8px 10px;margin-bottom:6px}.late b{font-size:13px;color:#a32d2d;display:block;margin-bottom:5px}
.toast{position:fixed;left:12px;right:12px;bottom:64px;max-width:496px;margin:0 auto;background:#2c2c2a;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;align-items:center;gap:10px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast span{flex:1}.toast button{background:none;border:1px solid #fff;color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<main>
<section id="cal">
  <div class="nav"><button class="btn2" onclick="shiftWeek(-1)">‹</button><h1 id="wk" style="margin:0"></h1><button class="btn2" onclick="shiftWeek(1)">›</button></div>
  <div class="sync" id="sync"></div>
  <div class="legend" id="legend"></div>
  <div id="days"></div>
  <button class="btn" id="rBtn" onclick="replanAll()">↻ Przeplanuj wszystko</button>
  <div class="hint">Stuknij krok, aby oznaczyć jako zrobiony.</div>
</section>
<section id="list" hidden>
  <h1 id="fHead">Nowe zadanie</h1>
  <label>Nazwa zadania</label><input id="fTitle" placeholder="np. Przygotowanie na zjazd">
  <label>Przedmiot</label><div class="combo"><input id="fSub" placeholder="np. Psychologia poznawcza" autocomplete="off"><button type="button" class="cbtn" onclick="toggleSubs()">▾</button><div id="subs" class="dd" hidden></div></div>
  <label>Co dokładnie jest do zrobienia</label><textarea id="fDesc" maxlength="2000" placeholder="Pisz swobodnie, np.: przeczytać rozdz. 3–5, prezentacja na 10 min. W środy pracuję, w weekendy nie mam czasu."></textarea>
  <label>Deadline</label><input id="fDl" type="date">
  <label>Kolor przedmiotu</label><div class="colors" id="fCol"></div>
  <div id="fSteps" hidden><label>Kroki (tekst i dzień)</label><div id="stepList"></div><button class="btn2" onclick="addStepRow()">+ krok</button></div>
  <button class="btn" id="fBtn" onclick="addTask()">+ Dodaj i rozplanuj</button>
  <button class="btn2" id="fCancel" style="width:100%;margin-top:8px" hidden onclick="cancelEdit()">Anuluj edycję</button>
  <h1 style="margin-top:22px">Zadania</h1>
  <div id="tasks"></div>
  <h1 style="margin-top:22px">Moje przedmioty</h1>
  <div id="subjList"></div>
  <div style="display:flex;gap:8px;margin-top:8px"><input id="nSub" placeholder="Nowy przedmiot"><button class="btn2" onclick="addSubj()">+ Dodaj</button></div>
  <div class="hint">Stuknij kółko, aby zmienić kolor przedmiotu.</div>
  
</section>
<section id="all" hidden>
  <h1>Poczekalnia</h1>
  <div class="hint" style="margin-top:0">Rzeczy, które nie trafiają jeszcze do kalendarza – np. egzamin w lutym. Rozplanujesz je później.</div>
  <label>Nazwa</label><input id="wTitle" placeholder="np. Egzamin z psychopatologii">
  <label>Przedmiot</label><input id="wSub" list="subDl" placeholder="np. Psychopatologia" autocomplete="off"><datalist id="subDl"></datalist>
  <label>Deadline (opcjonalnie)</label><input id="wDl" type="date">
  <button class="btn" onclick="addWait()">+ Dodaj do poczekalni</button>
  <h1 style="margin-top:22px">Wszystko</h1>
  <div id="allList"></div>
</section>
</main>
<nav class="tabs"><button id="tCal" class="on" onclick="tab('cal')">📅 Kalendarz</button><button id="tList" onclick="tab('list')">📝 Lista zadań</button><button id="tAll" onclick="tab('all')">🗂 Wszystko</button></nav>
<script>
const AI_URL = '/api/plan';
const COLORS=[['#d9ede3','#0f5a44'],['#dce9f7','#0c447c'],['#f6dde6','#72243e'],['#f8e8cc','#633806'],['#e6e3f8','#3c3489'],['#f3e0d8','#712b13'],['#d6eef2','#0b5563'],['#e9f2d2','#3b5a0e'],['#fbe0d3','#8a2e0a'],['#f0dcf2','#6a1f72'],['#fff2c2','#6b5300'],['#e4e4e1','#3a3a37'],['#d9e2fb','#1f3a8a'],['#fbd9d9','#8a1c1c'],['#d5f2e0','#14532d'],['#f7e3f0','#831843']];
const DAYS=['Nd','Pon','Wt','Śr','Czw','Pt','Sob'];
let S, week=0, selCol=0, lock=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== Dane: chmura (Cloudflare KV) + kopia na urządzeniu (offline) =====
const LS='planer';
function norm(d){d=d&&typeof d==='object'?d:{};if(!Array.isArray(d.tasks))d.tasks=[];if(!d.colors||typeof d.colors!=='object')d.colors={};if(!Array.isArray(d.wait))d.wait=[];return d}
function load(){try{return norm(JSON.parse(localStorage.getItem(LS)))}catch(e){return norm()}}
const meta={get rev(){return+localStorage.getItem('planer_rev')||0},set rev(v){localStorage.setItem('planer_rev',v)},
  get dirty(){return localStorage.getItem('planer_dirty')==='1'},set dirty(v){localStorage.setItem('planer_dirty',v?'1':'0')}};
let pushT=null,pushing=false,ver=0;
function keepLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function save(){keepLocal();ver++;meta.dirty=true;setSync('Zapisywanie…');clearTimeout(pushT);pushT=setTimeout(push,1200)}
function setSync(m,err){sync.textContent=m;sync.classList.toggle('err',!!err)}
async function push(){
  clearTimeout(pushT);if(pushing){pushT=setTimeout(push,800);return}
  pushing=true;const v=ver;
  try{
    const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:S})});
    if(!r.ok)throw 0;const j=await r.json();meta.rev=j.rev;
    if(v===ver){meta.dirty=false;setSync('☁ Zapisano w chmurze')}else pushT=setTimeout(push,800);
  }catch(e){setSync('⚠ Brak połączenia – zapisano na tym urządzeniu, wyślę do chmury później',1)}
  finally{pushing=false}
}
async function pull(){
  if(meta.dirty)return push();
  try{
    const r=await fetch('/api/data',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();
    if(!j.data){if(S.tasks.length||S.wait.length||Object.keys(S.colors).length)return save();setSync('☁ Połączono z chmurą');return}
    // tylko nowsza wersja z chmury, nigdy w trakcie przeciągania/edycji/przeplanowania
    if(j.rev>meta.rev&&!meta.dirty&&!drag&&!editId&&!lock){S=norm(j.data);meta.rev=j.rev;keepLocal();render()}
    setSync('☁ Zapisano w chmurze');
  }catch(e){setSync('⚠ Brak połączenia – pokazuję dane z tego urządzenia',1)}
}
addEventListener('online',pull);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')return pull();
  if(meta.dirty)fetch('/api/data',{method:'PUT',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({data:S})})
    .then(r=>r.ok&&r.json()).then(j=>{if(j){meta.rev=j.rev;meta.dirty=false}}).catch(()=>{});
});
setInterval(()=>{if(document.visibilityState==='visible')pull()},60000);

function toast(msg,act,fn,ms=5000){
  document.getElementById('toast')?.remove();
  const e=document.createElement('div');e.id='toast';e.className='toast';e.innerHTML=`<span>${esc(msg)}</span>`;
  if(act){const b=document.createElement('button');b.textContent=act;b.onclick=()=>{e.remove();fn()};e.append(b)}
  document.body.append(e);clearTimeout(toast.t);toast.t=setTimeout(()=>e.remove(),ms);
}
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
function monday(off){const d=new Date();d.setHours(12);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+off*7);return iso(d)}

// Rozbija opis na kroki
function steps(desc){
  const parts=desc.split(/,|;|\+|\n| i | oraz /i).map(s=>s.trim()).filter(Boolean);
  const out=[];
  for(const p of parts){
    const n=parseInt((p.match(/\d+/)||[1])[0]);
    const l=p.toLowerCase();
    if(/fragment|rozdzia|artyku|tekst|lektur|czyta/.test(l)){
      const what=/rozdzia/.test(l)?'rozdziału':/artyku/.test(l)?'artykułu':'fragmentu';
      for(let i=1;i<=Math.min(n,10);i++)out.push({text:`Czytanie ${what} ${n>1?i:''}`.trim(),w:1});
    }else if(/prezentac|slajd/.test(l)){
      out.push({text:'Prezentacja: konspekt i materiały',w:1},{text:'Prezentacja: slajdy',w:1});
    }else if(/egzamin|kolokwium|test|zalicz/.test(l)){
      out.push({text:'Nauka do egzaminu',w:1,last:1},{text:'Powtórka przed egzaminem',w:1,last:1});
    }else if(/projekt|esej|prac/.test(l)){
      out.push({text:p+' – plan',w:1},{text:p+' – pisanie',w:1},{text:p+' – poprawki',w:1});
    }else out.push({text:p.charAt(0).toUpperCase()+p.slice(1),w:1});
  }
  return out.sort((a,b)=>(a.last||0)-(b.last||0));
}

// Obciążenie dni przez inne zadania
function loads(skipId){const m={};S.tasks.forEach(t=>{if(t.id===skipId)return;t.steps.forEach(s=>{if(!s.done)m[s.date]=(m[s.date]||0)+1})});return m}

// Rozkłada kroki od dziś do dnia przed deadline'em, wybierając najmniej obciążone dni
function schedule(list,deadline,skipId){
  const start=today(),end=addD(deadline,-1);
  const D=Math.max(1,diff(start,end)+1),L=loads(skipId);
  let prev=0;
  return list.map((s,i)=>{
    const rem=list.length-i-1;
    const lo=s.last?Math.max(prev,D-1-rem):prev,hi=Math.max(lo,D-1-Math.floor(rem*D/list.length/1.5));
    let best=lo;
    for(let k=lo;k<=Math.min(hi,D-1);k++){if((L[addD(start,k)]||0)<(L[addD(start,best)]||0))best=k}
    const date=addD(start,diff(start,end)<0?0:best);
    L[date]=(L[date]||0)+1;prev=best;
    return{text:s.text,date,done:false};
  });
}

// Plan z AI (given = istniejące kroki do ponownego rozłożenia). null = AI nie odpowiedziało
async function aiPlan(t,given){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
  try{
    const r=await fetch(AI_URL,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t.title,subject:t.subject,desc:t.desc,deadline:t.deadline,today:today(),busy:loads(t.id),steps:given})});
    const j=await r.json();
    if(Array.isArray(j.steps)&&j.steps.length)return j.steps.map(s=>({text:s.text,date:s.date,done:false}));
  }catch(e){}finally{clearTimeout(to)}
  return null;
}
let fellBack=false;
async function plan(t){
  const a=await aiPlan(t);fellBack=!a;
  return a||schedule(steps(t.desc),t.deadline,t.id);
}
const FB_MSG='AI teraz nie odpowiada – plan ułożono prostszym algorytmem. Spróbuj później „Przeplanuj wszystko”.';

async function addTask(){
  if(editId)return saveEdit();
  const title=fTitle.value.trim(),sub=fSub.value.trim(),desc=fDesc.value.trim(),dl=fDl.value;
  if(!sub||!desc||!dl)return alertMsg('Uzupełnij przynajmniej przedmiot, opis i deadline.');
  if(dl<=today())return alertMsg('Deadline musi być w przyszłości.');
  S.colors[sub]=selCol;
  const t={id:Date.now(),title:title||sub,subject:sub,desc,deadline:dl};
  const b=document.querySelector('#list .btn');b.textContent='Planuję z AI…';b.disabled=true;
  t.steps=await plan(t);
  b.textContent='+ Dodaj i rozplanuj';b.disabled=false;
  if(fromWait){S.wait=S.wait.filter(w=>w.id!==fromWait);fromWait=null}
  S.tasks.push(t);save();fTitle.value='';fDesc.value='';render();tab('cal');
  if(fellBack)toast(FB_MSG,null,null,8000);
}
let editId=null;
function stepRow(s={text:'',date:today()}){return`<div class="srow"><input type="text" value="${esc(s.text)}"><input type="date" value="${s.date}"><button class="x" onclick="this.parentNode.remove()">✕</button></div>`}
function addStepRow(){stepList.insertAdjacentHTML('beforeend',stepRow())}
function edit(id){
  const t=S.tasks.find(t=>t.id===id);editId=id;
  fTitle.value=t.title;fSub.value=t.subject;fDesc.value=t.desc;fDl.value=t.deadline;fDl.min='';selCol=S.colors[t.subject]??0;
  stepList.innerHTML=t.steps.map(stepRow).join('');stepList._done=t.steps.map(s=>s.done);
  fHead.textContent='Edytuj zadanie';fBtn.textContent='💾 Zapisz zmiany';fSteps.hidden=fCancel.hidden=false;
  render();tab('list');scrollTo(0,0);
}
function cancelEdit(){editId=null;fromWait=null;fTitle.value='';fDesc.value='';fDl.min=addD(today(),1);fHead.textContent='Nowe zadanie';fBtn.textContent='+ Dodaj i rozplanuj';fSteps.hidden=fCancel.hidden=true;stepList.innerHTML=''}
async function saveEdit(){
  const t=S.tasks.find(t=>t.id===editId),sub=fSub.value.trim(),desc=fDesc.value.trim(),dl=fDl.value;
  if(!sub||!desc||!dl)return alertMsg('Uzupełnij przynajmniej przedmiot, opis i deadline.');
  const rows=[...stepList.children].map((r,i)=>{const[a,b]=r.querySelectorAll('input');return{text:a.value.trim(),date:b.value||today(),done:false,_i:i}}).filter(s=>s.text);
  // zachowaj status "zrobione" dla kroków o niezmienionym tekście
  rows.forEach(s=>{const o=t.steps.find(o=>o.text===s.text);if(o)s.done=o.done;delete s._i});
  const descChanged=desc!==t.desc;
  Object.assign(t,{title:fTitle.value.trim()||sub,subject:sub,desc,deadline:dl});
  S.colors[sub]=selCol;
  if(descChanged&&confirm('Opis się zmienił. Rozplanować kroki od nowa?')){fBtn.textContent='Planuję z AI…';fBtn.disabled=true;const done=t.steps.filter(s=>s.done),fresh=await plan(t);fBtn.disabled=false;
    t.steps=done.concat(fresh.filter(f=>!done.some(d=>d.text===f.text)));if(fellBack)toast(FB_MSG,null,null,8000)}
  else t.steps=rows;
  save();cancelEdit();render();tab('cal');
}
function alertMsg(m){let e=document.getElementById('err');if(!e){e=document.createElement('div');e.id='err';e.style.cssText='color:#a32d2d;font-size:13px;margin-top:8px';document.querySelector('#list .btn').after(e)}e.textContent=m;setTimeout(()=>e.textContent='',5000)}

// Przeplanuj: AI rozkłada od nowa niezrobione kroki (z zaległymi), z uwzględnieniem próśb z opisu. Zrobione zostają.
async function replanAll(){
  const t0=today(),todo=S.tasks.filter(t=>t.deadline>t0&&t.steps.some(s=>!s.done));
  if(!todo.length)return toast('Nie ma nic do przeplanowania.');
  const snap=JSON.stringify(S);let fb=0;lock=true;rBtn.disabled=true;
  for(const [i,t] of todo.entries()){
    rBtn.textContent=`Przeplanowuję z AI… ${i+1}/${todo.length}`;
    const done=t.steps.filter(s=>s.done),open=t.steps.filter(s=>!s.done);
    let ns=await aiPlan(t,open.map(s=>s.text));
    if(!ns){fb++;t.steps=done;ns=schedule(open,t.deadline,t.id)}
    t.steps=done.concat(ns);
  }
  lock=false;rBtn.disabled=false;rBtn.textContent='↻ Przeplanuj wszystko';save();render();
  toast(fb?`Przeplanowano (${fb} zad. prostszym algorytmem – AI nie odpowiada).`:'Przeplanowano z AI.','↶ Cofnij',()=>{S=norm(JSON.parse(snap));save();render();toast('Przywrócono poprzedni plan.')},15000);
}
function toggle(id,i){if(dragged)return;const t=S.tasks.find(t=>t.id===id);t.steps[i].done=!t.steps[i].done;save();render()}
function del(id){if(!confirm('Usunąć zadanie?'))return;S.tasks=S.tasks.filter(t=>t.id!==id);save();render()}
const col=s=>COLORS[S.colors[s]??0];

function render(){
  const m=monday(week),t0=today();
  wk.textContent=`${+m.slice(8)}.${m.slice(5,7)} – ${+addD(m,6).slice(8)}.${addD(m,6).slice(5,7)}`;
  legend.innerHTML=[...new Set(S.tasks.map(t=>t.subject))].map(s=>`<span style="color:${col(s)[1]}">● ${esc(s)}</span>`).join('');
  const blk=(t,s,k)=>{const[bg,fg]=col(t.subject);return`<div class="blk${s.done?' done':''}" style="background:${bg};color:${fg}" data-t="${t.id}" data-k="${k}" onclick="toggle(${t.id},${k})">${s.done?'✓ ':''}${esc(s.text)} <small>· ${esc(t.subject)}</small></div>`};
  let h='';
  if(week===0){
    const late=[];S.tasks.forEach(t=>t.steps.forEach((s,k)=>{if(!s.done&&s.date<t0)late.push(blk(t,s,k))}));
    if(late.length)h+=`<div class="late"><b>⚠ Zaległe (${late.length}) – stuknij, gdy zrobione, przytrzymaj i przeciągnij na dzień albo użyj „Przeplanuj wszystko”</b>${late.join('')}</div>`;
  }
  for(let i=0;i<7;i++){
    const d=addD(m,i),dt=new Date(d+'T12:00');
    let c='';
    S.tasks.forEach(t=>{
      t.steps.forEach((s,k)=>{if(s.date===d)c+=blk(t,s,k)});
      if(t.deadline===d){
        const label = esc(t.title && t.title !== t.subject ? `${t.title} (${t.subject})` : t.subject);
        c+=`<div class="dead">⚑ Deadline: ${label}</div>`;
      }
    });
    h+=`<div class="day${d===t0?' today':''}" data-d="${d}"><div class="dl">${DAYS[dt.getDay()]}<br>${dt.getDate()}</div><div style="flex:1">${c||'<div class="empty">wolne</div>'}</div></div>`;
  }
  days.innerHTML=h;
  renderSubj();
  tasks.innerHTML=S.tasks.length?S.tasks.slice().sort((a,b)=>a.deadline<b.deadline?-1:1).map(t=>{
    const[bg,fg]=col(t.subject),d=t.steps.filter(s=>s.done).length;
    const header=t.title&&t.title!==t.subject?`<b>${esc(t.title)}</b> <small>· ${esc(t.subject)}</small>`:`<b>${esc(t.subject)}</b>`;
    return`<div class="card" style="background:${bg};color:${fg}"><div>${header}<br><small>${d}/${t.steps.length} kroków · do ${t.deadline.slice(8)}.${t.deadline.slice(5,7)}</small></div><span style="white-space:nowrap"><button class="x" style="color:${fg}" onclick="edit(${t.id})">✎</button><button class="x" style="color:${fg}" onclick="del(${t.id})">✕</button></span></div>`
  }).join(''):'<div class="empty">Dodaj pierwsze zadanie powyżej.</div>';
  renderAll();
  fCol.innerHTML=COLORS.map((c,i)=>`<span style="background:${c[0]}" class="${i===selCol?'sel':''}" onclick="selCol=${i};render()"></span>`).join('');
}
function shiftWeek(n){week+=n;render();days.style.transform='';days.classList.remove('inL','inR');void days.offsetWidth;days.classList.add(n>0?'inL':'inR')}
// gest przesunięcia tygodnia
let sw=null;
days.addEventListener('touchstart',e=>{const p=e.touches[0];sw={x:p.clientX,y:p.clientY,h:null}},{passive:true});
days.addEventListener('touchmove',e=>{
  if(!sw||drag)return;const p=e.touches[0],dx=p.clientX-sw.x,dy=p.clientY-sw.y;
  if(sw.h===null&&Math.abs(dx)+Math.abs(dy)>10)sw.h=Math.abs(dx)>Math.abs(dy);
  if(sw.h){sw.dx=dx;days.style.transform=`translateX(${dx*.4}px)`;days.style.opacity=1-Math.min(Math.abs(dx)/600,.4)}
},{passive:true});
document.addEventListener('touchend',()=>{
  if(!sw)return;const dx=sw.dx||0,h=sw.h;sw=null;days.style.opacity='';
  if(h&&!dragged&&Math.abs(dx)>60)shiftWeek(dx<0?1:-1);else{days.style.transition='transform .2s';days.style.transform='';setTimeout(()=>days.style.transition='',200)}
});
// przeciąganie kroków: przytrzymaj ~0,3 s, przesuń na inny dzień; przy krawędzi ekranu zmienia tydzień
let drag=null,dragged=false,pressT=null;
const eL=document.createElement('div'),eR=document.createElement('div');eL.className=eR.className='edge';eL.style.left=0;eR.style.right=0;document.body.append(eL,eR);
days.addEventListener('contextmenu',e=>{if(e.target.closest('.blk'))e.preventDefault()});
days.addEventListener('touchstart',e=>{
  const b=e.target.closest('.blk');if(!b)return;const p=e.touches[0];
  const tgt=e.target,mv=ev=>onMove(ev),en=()=>{tgt.removeEventListener('touchmove',mv);tgt.removeEventListener('touchend',en);tgt.removeEventListener('touchcancel',en);endDrag()};
  tgt.addEventListener('touchmove',mv,{passive:false});tgt.addEventListener('touchend',en);tgt.addEventListener('touchcancel',en);
  pressT=setTimeout(()=>{
    const r=b.getBoundingClientRect(),g=b.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';document.body.append(g);
    drag={id:+b.dataset.t,k:+b.dataset.k,g,dx:p.clientX-r.left,dy:p.clientY-r.top,edgeT:null};
    eL.style.display=eR.style.display='block';navigator.vibrate&&navigator.vibrate(30);move(p.clientX,p.clientY);
  },300);
},{passive:true});
function over(){const o=days.querySelector('.over');o&&o.classList.remove('over')}
function move(x,y){
  drag.x=x;drag.y=y;drag.g.style.left=(x-drag.dx)+'px';drag.g.style.top=(y-drag.dy)+'px';
  over();const d=document.elementFromPoint(x,y)?.closest('.day');d&&d.classList.add('over');
  const side=x<40?-1:x>innerWidth-40?1:0;
  if(side&&!drag.edgeT)drag.edgeT=setInterval(()=>{if(!drag)return;shiftWeek(side);move(drag.x,drag.y)},700);
  if(!side&&drag.edgeT){clearInterval(drag.edgeT);drag.edgeT=null}
}
function onMove(e){
  if(!drag){clearTimeout(pressT);return}
  e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY);
}
function endDrag(){
  clearTimeout(pressT);if(!drag)return;
  clearInterval(drag.edgeT);drag.g.remove();eL.style.display=eR.style.display='none';
  const d=document.elementFromPoint(drag.x,drag.y)?.closest('.day');over();
  if(d){const t=S.tasks.find(t=>t.id===drag.id);t.steps[drag.k].date=d.dataset.d;save()}
  drag=null;dragged=true;setTimeout(()=>dragged=false,400);render();
}

// ===== Zakładka „Wszystko” + poczekalnia =====
let fromWait=null;
const MON=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
function addWait(){
  const title=wTitle.value.trim(),sub=wSub.value.trim(),dl=wDl.value;
  if(!title&&!sub)return toast('Wpisz nazwę albo przedmiot.');
  if(sub&&S.colors[sub]==null){const used=Object.values(S.colors);const c=COLORS.findIndex((_,i)=>!used.includes(i));S.colors[sub]=c<0?0:c}
  S.wait.push({id:Date.now(),title:title||sub,subject:sub,deadline:dl,done:false});
  wTitle.value='';wSub.value='';wDl.value='';save();render();
}
function wDone(id){const w=S.wait.find(w=>w.id===id);w.done=!w.done;save();render()}
function wDel(id){if(!confirm('Usunąć z poczekalni?'))return;S.wait=S.wait.filter(w=>w.id!==id);save();render()}
function wPlan(id){
  const w=S.wait.find(w=>w.id===id);cancelEdit();fromWait=id;
  fTitle.value=w.title;fSub.value=w.subject;fDl.value=w.deadline>today()?w.deadline:'';fDesc.value='';selCol=S.colors[w.subject]??0;
  render();tab('list');scrollTo(0,0);fDesc.focus();
  toast('Opisz, co jest do zrobienia, i stuknij „Dodaj i rozplanuj”.');
}
function renderAll(){
  subDl.innerHTML=Object.keys(S.colors).map(n=>`<option value="${esc(n)}">`).join('');
  const items=S.tasks.map(t=>({t,dl:t.deadline,done:t.steps.length>0&&t.steps.every(s=>s.done)})).concat(S.wait.map(w=>({w,dl:w.deadline||'',done:w.done})));
  if(!items.length){allList.innerHTML='<div class="empty">Na razie pusto.</div>';return}
  items.sort((a,b)=>!a.dl?1:!b.dl?-1:a.dl<b.dl?-1:a.dl>b.dl?1:0);
  let h='',last=null;const t0=today();
  for(const it of items){
    const o=it.t||it.w,[bg,fg]=col(o.subject);
    const grp=it.dl?MON[+it.dl.slice(5,7)-1]+' '+it.dl.slice(0,4):'Bez daty';
    if(grp!==last){h+=`<h2 style="font-size:15px;margin:16px 0 4px;color:#777">${grp}</h2>`;last=grp}
    const name=o.title&&o.title!==o.subject?`<b>${esc(o.title)}</b>${o.subject?` <small>· ${esc(o.subject)}</small>`:''}`:`<b>${esc(o.subject||o.title)}</b>`;
    const date=it.dl?`${it.dl.slice(8)}.${it.dl.slice(5,7)}`:'';
    const info=it.t?`📅 w kalendarzu · ${it.t.steps.filter(s=>s.done).length}/${it.t.steps.length} kroków`:'⏳ poczekalnia';
    const st=it.done?'✓ zrobione':(it.dl&&it.dl<t0?'po terminie':'');
    const btns=it.w?`<span style="white-space:nowrap"><button class="x" style="color:${fg}" title="Zrobione" onclick="wDone(${o.id})">${o.done?'↶':'✓'}</button>${o.done?'':`<button class="x" style="color:${fg}" title="Rozplanuj" onclick="wPlan(${o.id})">📅</button>`}<button class="x" style="color:${fg}" onclick="wDel(${o.id})">✕</button></span>`:'';
    h+=`<div class="card" style="background:${bg};color:${fg};${it.done?'opacity:.55':''}"><div>${name}<br><small>${[date,info,st].filter(Boolean).join(' · ')}</small></div>${btns}</div>`;
  }
  allList.innerHTML=h;
}
function tab(x){cal.hidden=x!=='cal';list.hidden=x!=='list';all.hidden=x!=='all';tCal.classList.toggle('on',x==='cal');tList.classList.toggle('on',x==='list');tAll.classList.toggle('on',x==='all')}
function addSubj(){const n=nSub.value.trim();if(!n)return;if(S.colors[n]==null){const used=Object.values(S.colors);let c=COLORS.findIndex((_,i)=>!used.includes(i));S.colors[n]=c<0?0:c;save()}nSub.value='';render()}
function delSubj(n){
  const k=S.tasks.filter(t=>t.subject===n).length+S.wait.filter(w=>w.subject===n).length;
  if(!confirm(k?`Przedmiot „${n}” ma ${k} zadań. Usunąć przedmiot razem z zadaniami?`:`Usunąć przedmiot „${n}”?`))return;
  S.tasks=S.tasks.filter(t=>t.subject!==n);S.wait=S.wait.filter(w=>w.subject!==n);delete S.colors[n];save();render();
}
function cycleCol(n){S.colors[n]=(S.colors[n]+1)%COLORS.length;save();render()}
function renderSubj(){
  const L=Object.keys(S.colors).sort((a,b)=>a.localeCompare(b,'pl'));
  subjList.innerHTML=L.length?L.map((n,i)=>{const[bg,fg]=COLORS[S.colors[n]];return`<div class="subj"><i style="background:${bg};border:2px solid ${fg}" onclick="cycleCol(SL[${i}])"></i><span>${esc(n)}</span><button class="x" onclick="delSubj(SL[${i}])">✕</button></div>`}).join(''):'<div class="empty">Brak przedmiotów – dodaj pierwszy.</div>';
  window.SL=L;
}
function showSubs(all){
  const q=all?'':fSub.value.trim().toLowerCase(),L=Object.keys(S.colors).filter(s=>s.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b,'pl'));
  subs.innerHTML=L.map(s=>`<div data-s="${esc(s)}"><i style="background:${COLORS[S.colors[s]][0]};border:2px solid ${COLORS[S.colors[s]][1]}"></i>${esc(s)}</div>`).join('');
  subs.hidden=!L.length;
}
function toggleSubs(){if(subs.hidden){showSubs(true);fSub.focus()}else subs.hidden=true}
fSub.addEventListener('focus',()=>showSubs(true));
fSub.addEventListener('input',()=>showSubs(false));
subs.addEventListener('pointerdown',e=>{const d=e.target.closest('[data-s]');if(!d)return;e.preventDefault();fSub.value=d.dataset.s;selCol=S.colors[fSub.value];subs.hidden=true;render()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.combo'))subs.hidden=true});
fSub.addEventListener('change',()=>{if(S.colors[fSub.value]!=null){selCol=S.colors[fSub.value];render()}});

S=load();
fDl.min=addD(today(),1);
render();
setSync(meta.dirty?'Zapisywanie…':'Łączenie z chmurą…');pull();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body>
